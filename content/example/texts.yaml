# Пример контента вымышленного клуба.
# Все тексты ниже — образец. Замените их на свои.

brand: Пример
payment_description: "Подписка на клуб «{brand}», {title}"

start: |
  Это пример текста, замените на свой.

  Добро пожаловать в клуб!

  Здесь мы публикуем материалы по теме клуба, отвечаем на вопросы и общаемся с участниками.

  Что есть внутри:
  — регулярные публикации;
  — обсуждения и поддержка участников;
  — разборы вопросов;
  — анонсы встреч и других активностей.

  Оформить подписку можно прямо в боте. Если что-то непонятно, напишите нам — поможем.

description: |
  Это пример текста, замените на свой.

  Клуб — это закрытое сообщество для тех, кому интересна тема клуба. Мы делимся материалами, разбираем вопросы и поддерживаем друг друга.

  Подписка даёт доступ к публикациям, обсуждениям и встречам.

faq: |
  Это пример текста, замените на свой.

  Частые вопросы:

  1. Как оформить подписку? — Нажмите «Оформить подписку» и выберите тариф.
  2. Как продлить подписку? — Подписка продлевается автоматически, если включено автопродление.
  3. Как отменить подписку? — В разделе «Моя подписка» нажмите «Отменить подписку».
  4. Как изменить карту? — В разделе «Моя подписка» выберите «Заменить карту».
  5. Куда писать с вопросами? — Прямо в бот, сообщение уйдёт администратору.

rules: |
  Это пример текста, замените на свой.

  Правила клуба:

  1. Уважайте других участников.
  2. Не публикуйте рекламу и спам без согласования.
  3. Не передавайте доступ и материалы клуба третьим лицам.
  4. Соблюдайте законодательство.

  За нарушение правил доступ может быть ограничен.

support: |
  Это пример текста, замените на свой.

  Если нужна помощь, напишите нам. Можете написать свой вопрос прямо здесь, в боте — сообщение уйдёт администратору.

