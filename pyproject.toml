[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-subscription-club"
version = "0.1.0"
description = "Telegram-бот закрытого клуба: приём уведомлений банка и автопродление подписок"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "aiogram>=3",
    "aiohttp-socks",
    "httpx[socks]",
    "pydantic-settings",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Дословные тексты Salebot и их эталон в тесте — длинные строки не переносим.
"app/texts.py" = ["E501"]
"tests/test_registration.py" = ["E501"]
"tests/test_private_content.py" = ["E501"]
