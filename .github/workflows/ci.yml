name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: club_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d club_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/club_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/club_test
      CONTENT_DIR: ./content/example

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks сканирует всю историю, а не только последний коммит.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Alembic
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q

      - name: Public leak check
        run: python scripts/check_public.py

      - name: Gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t club-ci .
